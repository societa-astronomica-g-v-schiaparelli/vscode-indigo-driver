version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Must match engines.vscode: vsce refuses a newer @types/vscode.
      - dependency-name: "@types/vscode"
      # Must match engines.node and .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
